name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "CFBundleShortVersionString (for example: 0.2.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: book-sender-release
  cancel-in-progress: false

jobs:
  build_release_candidate:
    name: Build release candidate
    runs-on: macos-26
    outputs:
      zip_name: ${{ steps.package.outputs.zip_name }}
      zip_length: ${{ steps.package.outputs.zip_length }}
      zip_sha256: ${{ steps.package.outputs.zip_sha256 }}
      ed_signature: ${{ steps.sparkle-signature.outputs.ed_signature }}
    env:
      PROJECT: BookSender.xcodeproj
      SCHEME: BookSender
      APP_BUNDLE_NAME: BookSender.app
      APP_DISPLAY_NAME: BookSender
      BUNDLE_IDENTIFIER: com.rckbrcls.BookSender
      REPO: rckbrcls/book-sender
      APPCAST_PATH: appcast.xml
      SPARKLE_TOOLS_VERSION: 2.9.2
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release input
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use X.Y.Z format."
            exit 1
          fi

          if git rev-parse "refs/tags/v${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "Tag v${RELEASE_VERSION} already exists."
            exit 1
          fi

          if gh release view "v${RELEASE_VERSION}" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release v${RELEASE_VERSION} already exists."
            exit 1
          fi

          echo "SHORT_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "BUILD_VERSION=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Validate pinned release signing inputs
        env:
          BOOKSENDER_CODESIGN_P12_BASE64: ${{ secrets.BOOKSENDER_CODESIGN_P12_BASE64 }}
          BOOKSENDER_CODESIGN_P12_PASSWORD: ${{ secrets.BOOKSENDER_CODESIGN_P12_PASSWORD }}
        run: |
          set -euo pipefail

          source scripts/signing/release-signing-policy.sh

          if [ -z "${BOOKSENDER_CODESIGN_P12_BASE64:-}" ]; then
            echo "Missing BOOKSENDER_CODESIGN_P12_BASE64 secret."
            exit 1
          fi
          if [ -z "${BOOKSENDER_CODESIGN_P12_PASSWORD:-}" ]; then
            echo "Missing BOOKSENDER_CODESIGN_P12_PASSWORD secret."
            exit 1
          fi
          if [ ! -f "$SIGNING_CERTIFICATE_PATH" ]; then
            echo "The pinned public signing certificate is missing."
            exit 1
          fi
          if [ "$SIGNING_BUNDLE_IDENTIFIER" != "$BUNDLE_IDENTIFIER" ]; then
            echo "The pinned signing policy has an unexpected bundle identifier."
            exit 1
          fi

          ACTUAL_CERTIFICATE_SHA1=$(openssl x509 \
            -inform DER \
            -in "$SIGNING_CERTIFICATE_PATH" \
            -noout \
            -fingerprint \
            -sha1 \
            | cut -d= -f2 \
            | tr -d ':')
          if [ "$ACTUAL_CERTIFICATE_SHA1" != "$SIGNING_CERTIFICATE_SHA1" ]; then
            echo "The pinned public signing certificate does not match the release policy."
            exit 1
          fi

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Verify installer and appcast contracts
        run: |
          set -euo pipefail

          bash scripts/tests/install_contract_test.sh
          bash scripts/tests/signing_contract_test.sh
          python3 scripts/tests/appcast_contract_test.py

      - name: Build universal Release
        run: |
          set -euo pipefail

          DERIVED_DATA="$RUNNER_TEMP/DerivedData"
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -derivedDataPath "$DERIVED_DATA" \
            "ARCHS=arm64 x86_64" \
            "ONLY_ACTIVE_ARCH=NO" \
            "MARKETING_VERSION=$SHORT_VERSION" \
            "CURRENT_PROJECT_VERSION=$BUILD_VERSION" \
            "CODE_SIGNING_ALLOWED=NO" \
            "CODE_SIGNING_REQUIRED=NO" \
            "CODE_SIGN_IDENTITY=" \
            "CODE_SIGN_STYLE=Manual"

          APP_PATH="$DERIVED_DATA/Build/Products/Release/$APP_BUNDLE_NAME"
          if [ ! -d "$APP_PATH" ]; then
            echo "App not found at $APP_PATH"
            exit 1
          fi

          APP_EXECUTABLE="$APP_PATH/Contents/MacOS/$APP_DISPLAY_NAME"
          ARCHITECTURES=$(lipo -archs "$APP_EXECUTABLE")
          if [[ "$ARCHITECTURES" != *"arm64"* || "$ARCHITECTURES" != *"x86_64"* ]]; then
            echo "Expected arm64 and x86_64, found: $ARCHITECTURES"
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Verify update configuration
        run: |
          set -euo pipefail

          INFO_PLIST="$APP_PATH/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$INFO_PLIST")" = "$BUNDLE_IDENTIFIER"
          test "$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$INFO_PLIST")" = "$SHORT_VERSION"
          test "$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$INFO_PLIST")" = "$BUILD_VERSION"
          test "$(/usr/libexec/PlistBuddy -c "Print :SUFeedURL" "$INFO_PLIST")" = "https://rckbrcls.com/api/book-sender/appcast.xml"
          /usr/libexec/PlistBuddy -c "Print :SUPublicEDKey" "$INFO_PLIST" >/dev/null
          test "$(/usr/libexec/PlistBuddy -c "Print :SUEnableInstallerLauncherService" "$INFO_PLIST")" = "true"

      - name: Sign app bundle with pinned release identity
        env:
          BOOKSENDER_CODESIGN_P12_BASE64: ${{ secrets.BOOKSENDER_CODESIGN_P12_BASE64 }}
          BOOKSENDER_CODESIGN_P12_PASSWORD: ${{ secrets.BOOKSENDER_CODESIGN_P12_PASSWORD }}
        run: |
          set -euo pipefail

          source scripts/signing/release-signing-policy.sh

          SIGNING_KEYCHAIN="$RUNNER_TEMP/booksender-release-signing.keychain-db"
          P12_PATH="$RUNNER_TEMP/booksender-release-signing.p12"
          IMPORTED_CERTIFICATE_PEM="$RUNNER_TEMP/booksender-release-signing.pem"
          IMPORTED_CERTIFICATE_DER="$RUNNER_TEMP/booksender-release-signing.cer"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32 | tr -d '\n')
          ORIGINAL_USER_KEYCHAINS=()
          while IFS= read -r keychain_entry; do
            keychain_entry="${keychain_entry#*\"}"
            keychain_entry="${keychain_entry%\"*}"
            if [ -n "$keychain_entry" ]; then
              ORIGINAL_USER_KEYCHAINS+=("$keychain_entry")
            fi
          done < <(security list-keychains -d user)

          cleanup_signing_material() {
            if [ "${#ORIGINAL_USER_KEYCHAINS[@]}" -gt 0 ]; then
              security list-keychains \
                -d user \
                -s "${ORIGINAL_USER_KEYCHAINS[@]}" >/dev/null 2>&1 || true
            fi
            security delete-keychain "$SIGNING_KEYCHAIN" >/dev/null 2>&1 || true
            rm -f \
              "$SIGNING_KEYCHAIN" \
              "$P12_PATH" \
              "$IMPORTED_CERTIFICATE_PEM" \
              "$IMPORTED_CERTIFICATE_DER"
          }
          trap cleanup_signing_material EXIT

          printf "%s" "$BOOKSENDER_CODESIGN_P12_BASE64" \
            | /usr/bin/base64 -D > "$P12_PATH"
          chmod 600 "$P12_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$SIGNING_KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$SIGNING_KEYCHAIN"
          security import "$P12_PATH" \
            -k "$SIGNING_KEYCHAIN" \
            -P "$BOOKSENDER_CODESIGN_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$SIGNING_KEYCHAIN" >/dev/null
          security list-keychains \
            -d user \
            -s "$SIGNING_KEYCHAIN"

          security find-certificate \
            -c "$SIGNING_IDENTITY_NAME" \
            -p \
            "$SIGNING_KEYCHAIN" > "$IMPORTED_CERTIFICATE_PEM"
          openssl x509 \
            -in "$IMPORTED_CERTIFICATE_PEM" \
            -outform DER \
            -out "$IMPORTED_CERTIFICATE_DER"
          if ! cmp -s "$SIGNING_CERTIFICATE_PATH" "$IMPORTED_CERTIFICATE_DER"; then
            echo "The imported identity does not match the pinned public certificate."
            exit 1
          fi

          SIGNING_IDENTITY_SHA1=$(security find-identity \
            -p codesigning \
            "$SIGNING_KEYCHAIN" \
            | grep -F "\"$SIGNING_IDENTITY_NAME\"" \
            | awk 'NR == 1 {print $2}')
          if [ "$SIGNING_IDENTITY_SHA1" != "$SIGNING_CERTIFICATE_SHA1" ]; then
            echo "The imported signing identity has an unexpected fingerprint."
            exit 1
          fi

          SPARKLE_FRAMEWORK="$APP_PATH/Contents/Frameworks/Sparkle.framework"
          if [ ! -d "$SPARKLE_FRAMEWORK" ]; then
            echo "Sparkle.framework is missing from the app bundle."
            exit 1
          fi

          sign_runtime_component() {
            local component="$1"
            if [ -e "$component" ]; then
              codesign \
                --force \
                --keychain "$SIGNING_KEYCHAIN" \
                --sign "$SIGNING_IDENTITY_SHA1" \
                --options runtime \
                --timestamp=none \
                "$component"
            fi
          }

          sign_runtime_component "$SPARKLE_FRAMEWORK/Versions/B/XPCServices/Installer.xpc"

          DOWNLOADER_XPC="$SPARKLE_FRAMEWORK/Versions/B/XPCServices/Downloader.xpc"
          if [ -e "$DOWNLOADER_XPC" ]; then
            codesign \
              --force \
              --keychain "$SIGNING_KEYCHAIN" \
              --sign "$SIGNING_IDENTITY_SHA1" \
              --options runtime \
              --timestamp=none \
              --preserve-metadata=entitlements \
              "$DOWNLOADER_XPC"
          fi

          sign_runtime_component "$SPARKLE_FRAMEWORK/Versions/B/Autoupdate"
          sign_runtime_component "$SPARKLE_FRAMEWORK/Versions/B/Updater.app"
          codesign \
            --force \
            --keychain "$SIGNING_KEYCHAIN" \
            --sign "$SIGNING_IDENTITY_SHA1" \
            --options runtime \
            --timestamp=none \
            "$SPARKLE_FRAMEWORK"

          EXPANDED_ENTITLEMENTS="$RUNNER_TEMP/BookSender.entitlements"
          sed \
            's/$(PRODUCT_BUNDLE_IDENTIFIER)/'"$BUNDLE_IDENTIFIER"'/g' \
            BookSender/BookSender.entitlements > "$EXPANDED_ENTITLEMENTS"

          codesign \
            --force \
            --keychain "$SIGNING_KEYCHAIN" \
            --sign "$SIGNING_IDENTITY_SHA1" \
            --options runtime \
            --timestamp=none \
            --entitlements "$EXPANDED_ENTITLEMENTS" \
            -r="designated => anchor H\"$SIGNING_CERTIFICATE_SHA1\" and identifier \"$BUNDLE_IDENTIFIER\"" \
            "$APP_PATH"

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign \
            --verify \
            -R="anchor H\"$SIGNING_CERTIFICATE_SHA1\" and identifier \"$BUNDLE_IDENTIFIER\"" \
            "$APP_PATH"

          if codesign -dvvv "$APP_PATH" 2>&1 | grep -Fq "Signature=adhoc"; then
            echo "Distributed artifacts must not use ad-hoc signing."
            exit 1
          fi

          SIGNING_DETAILS=$(codesign -dvvv "$APP_PATH" 2>&1)
          if ! printf "%s\n" "$SIGNING_DETAILS" \
            | grep -Eq '^CodeDirectory .*flags=.*\(.*runtime.*\)'; then
            echo "The main app must retain the hardened runtime."
            exit 1
          fi
          if ! printf "%s\n" "$SIGNING_DETAILS" \
            | grep -Fqx "TeamIdentifier=not set"; then
            echo "The pinned self-signed identity changed its Team ID contract."
            exit 1
          fi

          EXPECTED_REQUIREMENT="$SIGNING_DESIGNATED_REQUIREMENT"
          ACTUAL_REQUIREMENT=$(codesign -d -r- "$APP_PATH" 2>&1 \
            | sed -n 's/^designated => //p')
          if [ "$ACTUAL_REQUIREMENT" != "$EXPECTED_REQUIREMENT" ]; then
            echo "The app designated requirement changed unexpectedly."
            exit 1
          fi

          SIGNED_ENTITLEMENTS="$RUNNER_TEMP/signed-entitlements.plist"
          codesign -d --entitlements - --xml "$APP_PATH" > "$SIGNED_ENTITLEMENTS"
          test "$(/usr/libexec/PlistBuddy -c "Print :com.apple.security.app-sandbox" "$SIGNED_ENTITLEMENTS")" = "true"
          test "$(/usr/libexec/PlistBuddy -c "Print :com.apple.security.cs.disable-library-validation" "$SIGNED_ENTITLEMENTS")" = "true"
          test "$(/usr/libexec/PlistBuddy -c "Print :com.apple.security.network.client" "$SIGNED_ENTITLEMENTS")" = "true"
          /usr/libexec/PlistBuddy -c "Print :com.apple.security.temporary-exception.mach-lookup.global-name:0" "$SIGNED_ENTITLEMENTS"
          /usr/libexec/PlistBuddy -c "Print :com.apple.security.temporary-exception.mach-lookup.global-name:1" "$SIGNED_ENTITLEMENTS"

          for component in \
            "$SPARKLE_FRAMEWORK/Versions/B/XPCServices/Installer.xpc" \
            "$SPARKLE_FRAMEWORK/Versions/B/XPCServices/Downloader.xpc" \
            "$SPARKLE_FRAMEWORK/Versions/B/Autoupdate" \
            "$SPARKLE_FRAMEWORK/Versions/B/Updater.app" \
            "$SPARKLE_FRAMEWORK"; do
            if [ -e "$component" ] \
              && codesign -d --entitlements - --xml "$component" 2>/dev/null \
                | grep -Fq "com.apple.security.cs.disable-library-validation"; then
              echo "Only the main executable may disable library validation."
              exit 1
            fi
          done

      - name: Verify signed app launch
        run: |
          set -euo pipefail

          scripts/tests/signed_app_launch_smoke_test.sh \
            --app "$APP_PATH" \
            --minimum-seconds 5

      - name: Package ZIP
        id: package
        run: |
          set -euo pipefail

          ZIP_NAME="${APP_DISPLAY_NAME}-macos-universal-v${SHORT_VERSION}.zip"
          ZIP_PATH="$RUNNER_TEMP/$ZIP_NAME"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_PATH"

          ZIP_LENGTH=$(stat -f%z "$ZIP_PATH")
          ZIP_SHA256=$(shasum -a 256 "$ZIP_PATH" | awk '{print $1}')
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"
          echo "ZIP_LENGTH=$ZIP_LENGTH" >> "$GITHUB_ENV"
          echo "ZIP_SHA256=$ZIP_SHA256" >> "$GITHUB_ENV"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "zip_length=$ZIP_LENGTH" >> "$GITHUB_OUTPUT"
          echo "zip_sha256=$ZIP_SHA256" >> "$GITHUB_OUTPUT"

      - name: Verify packaged product contract
        run: bash scripts/tests/install_contract_test.sh

      - name: Download Sparkle tools
        run: |
          set -euo pipefail

          SPARKLE_TAR="Sparkle-${SPARKLE_TOOLS_VERSION}.tar.xz"
          SPARKLE_URL="https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_TOOLS_VERSION}/${SPARKLE_TAR}"
          curl -fsSL "$SPARKLE_URL" -o "$RUNNER_TEMP/$SPARKLE_TAR"
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xJf "$RUNNER_TEMP/$SPARKLE_TAR" -C "$RUNNER_TEMP/sparkle" --strip-components=1
          test -x "$RUNNER_TEMP/sparkle/bin/sign_update"
          echo "SPARKLE_BIN=$RUNNER_TEMP/sparkle/bin" >> "$GITHUB_ENV"

      - name: Sign update with EdDSA
        id: sparkle-signature
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SPARKLE_EDDSA_PRIVATE_KEY:-}" ]; then
            echo "Missing SPARKLE_EDDSA_PRIVATE_KEY secret."
            exit 1
          fi

          KEY_FILE="$RUNNER_TEMP/sparkle_ed25519.key"
          cleanup_sparkle_key() {
            rm -f "$KEY_FILE"
          }
          trap cleanup_sparkle_key EXIT
          printf "%s" "$SPARKLE_EDDSA_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          SIGN_OUTPUT=$("$SPARKLE_BIN/sign_update" --ed-key-file "$KEY_FILE" "$ZIP_PATH")
          SIGNATURE=$(printf "%s" "$SIGN_OUTPUT" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')
          if [ -z "$SIGNATURE" ]; then
            echo "Failed to extract the Sparkle EdDSA signature."
            exit 1
          fi

          echo "ED_SIGNATURE=$SIGNATURE" >> "$GITHUB_ENV"
          echo "ed_signature=$SIGNATURE" >> "$GITHUB_OUTPUT"

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: booksender-release-candidate
          path: ${{ runner.temp }}/${{ steps.package.outputs.zip_name }}
          if-no-files-found: error
          retention-days: 1

  validate_clean_consumer:
    name: Validate clean consumer
    runs-on: macos-26
    needs: build_release_candidate
    env:
      SHORT_VERSION: ${{ inputs.version }}
      ZIP_NAME: ${{ needs.build_release_candidate.outputs.zip_name }}
      ZIP_SHA256: ${{ needs.build_release_candidate.outputs.zip_sha256 }}
    steps:
      - name: Checkout validation source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download release candidate
        uses: actions/download-artifact@v4
        with:
          name: booksender-release-candidate
          path: ${{ runner.temp }}/release-candidate

      - name: Validate clean consumer installation and launch
        run: |
          set -euo pipefail

          source scripts/signing/release-signing-policy.sh

          ZIP_PATH="$RUNNER_TEMP/release-candidate/$ZIP_NAME"
          TEMP_KEYCHAIN="$RUNNER_TEMP/BookSenderConsumerValidation.keychain-db"
          TEMP_APPLICATIONS="$RUNNER_TEMP/ConsumerApplications"
          TEMP_KEYCHAIN_PASSWORD=$(openssl rand -base64 32 | tr -d '\n')
          ORIGINAL_USER_KEYCHAINS=()
          while IFS= read -r keychain_entry; do
            keychain_entry="${keychain_entry#*\"}"
            keychain_entry="${keychain_entry%\"*}"
            if [ -n "$keychain_entry" ]; then
              ORIGINAL_USER_KEYCHAINS+=("$keychain_entry")
            fi
          done < <(security list-keychains -d user)

          cleanup_consumer_validation() {
            if [ "${#ORIGINAL_USER_KEYCHAINS[@]}" -gt 0 ]; then
              security list-keychains \
                -d user \
                -s "${ORIGINAL_USER_KEYCHAINS[@]}" >/dev/null 2>&1 || true
            fi
            security delete-keychain "$TEMP_KEYCHAIN" >/dev/null 2>&1 || true
            rm -rf "$TEMP_APPLICATIONS"
          }
          trap cleanup_consumer_validation EXIT

          test -f "$ZIP_PATH"
          ACTUAL_ZIP_SHA256=$(shasum -a 256 "$ZIP_PATH" | awk '{print $1}')
          if [ "$ACTUAL_ZIP_SHA256" != "$ZIP_SHA256" ]; then
            echo "Release candidate digest changed before clean-consumer validation."
            exit 1
          fi
          if security find-certificate -a -Z 2>/dev/null \
            | grep -F "SHA-1 hash: $SIGNING_CERTIFICATE_SHA1" >/dev/null; then
            echo "The clean consumer runner already trusts the pinned certificate."
            exit 1
          fi

          mkdir -p "$TEMP_APPLICATIONS"
          security create-keychain -p "$TEMP_KEYCHAIN_PASSWORD" "$TEMP_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$TEMP_KEYCHAIN"
          security unlock-keychain -p "$TEMP_KEYCHAIN_PASSWORD" "$TEMP_KEYCHAIN"
          security list-keychains \
            -d user \
            -s "$TEMP_KEYCHAIN" "${ORIGINAL_USER_KEYCHAINS[@]}"

          BOOKSENDER_INSTALLER_ARCHIVE_PATH="$ZIP_PATH" \
          BOOKSENDER_INSTALLER_CERTIFICATE_PATH="$GITHUB_WORKSPACE/$SIGNING_CERTIFICATE_PATH" \
          BOOKSENDER_INSTALLER_KEYCHAIN_PATH="$TEMP_KEYCHAIN" \
          BOOKSENDER_INSTALLER_TARGET_DIRECTORY="$TEMP_APPLICATIONS" \
          BOOKSENDER_INSTALLER_ACCEPT_CERTIFICATE_REGISTRATION=1 \
          bash scripts/install.sh --version "$SHORT_VERSION"

          if ! security find-certificate -a -Z "$TEMP_KEYCHAIN" 2>/dev/null \
            | grep -F "SHA-1 hash: $SIGNING_CERTIFICATE_SHA1" >/dev/null; then
            echo "The installer did not register the pinned public certificate."
            exit 1
          fi
          if security find-identity -p codesigning "$TEMP_KEYCHAIN" \
            | grep -Fq "$SIGNING_CERTIFICATE_SHA1"; then
            echo "The consumer bootstrap imported a forbidden private identity."
            exit 1
          fi

          APP_PATH="$TEMP_APPLICATIONS/BookSender.app"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign \
            --verify \
            -R="anchor H\"$SIGNING_CERTIFICATE_SHA1\" and identifier \"$SIGNING_BUNDLE_IDENTIFIER\"" \
            "$APP_PATH"
          scripts/tests/signed_app_launch_smoke_test.sh \
            --app "$APP_PATH" \
            --minimum-seconds 5

  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - build_release_candidate
      - validate_clean_consumer
    env:
      REPO: rckbrcls/book-sender
      APPCAST_PATH: appcast.xml
      SHORT_VERSION: ${{ inputs.version }}
      BUILD_VERSION: ${{ github.run_number }}
      ZIP_NAME: ${{ needs.build_release_candidate.outputs.zip_name }}
      ZIP_LENGTH: ${{ needs.build_release_candidate.outputs.zip_length }}
      ZIP_SHA256: ${{ needs.build_release_candidate.outputs.zip_sha256 }}
      ED_SIGNATURE: ${{ needs.build_release_candidate.outputs.ed_signature }}
    steps:
      - name: Checkout publication source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Download validated release candidate
        uses: actions/download-artifact@v4
        with:
          name: booksender-release-candidate
          path: ${{ runner.temp }}/release-candidate

      - name: Validate publication inputs
        run: |
          set -euo pipefail

          ZIP_PATH="$RUNNER_TEMP/release-candidate/$ZIP_NAME"
          test -f "$ZIP_PATH"
          ACTUAL_ZIP_LENGTH=$(wc -c < "$ZIP_PATH" | tr -d ' ')
          if [ "$ACTUAL_ZIP_LENGTH" != "$ZIP_LENGTH" ]; then
            echo "Validated release candidate size changed before publication."
            exit 1
          fi
          ACTUAL_ZIP_SHA256=$(sha256sum "$ZIP_PATH" | awk '{print $1}')
          if [ "$ACTUAL_ZIP_SHA256" != "$ZIP_SHA256" ]; then
            echo "Validated release candidate digest changed before publication."
            exit 1
          fi
          if [ -z "$ED_SIGNATURE" ]; then
            echo "Validated release candidate is missing its Sparkle signature."
            exit 1
          fi
          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"

      - name: Update appcast
        run: |
          set -euo pipefail

          PUB_DATE=$(date -u "+%a, %d %b %Y %H:%M:%S +0000")
          python3 scripts/update_appcast.py \
            --appcast "$APPCAST_PATH" \
            --title "Book Sender" \
            --link "https://github.com/${REPO}" \
            --description "Book Sender updates" \
            --language "en" \
            --version "$BUILD_VERSION" \
            --short-version "$SHORT_VERSION" \
            --minimum-system-version "26.0" \
            --pub-date "$PUB_DATE" \
            --enclosure-url "https://github.com/${REPO}/releases/download/v${SHORT_VERSION}/${ZIP_NAME}" \
            --enclosure-length "$ZIP_LENGTH" \
            --ed-signature "$ED_SIGNATURE" \
            --release-notes "Book Sender ${SHORT_VERSION}. SMTP delivery remains experimental in this release."

      - name: Generate release notes
        run: |
          set -euo pipefail

          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          {
            echo "## Book Sender ${SHORT_VERSION}"
            echo
            echo "Book Sender is a lightweight native macOS app for preparing EPUB and PDF books for Kindle delivery."
            echo
            echo "### Install"
            echo
            printf '%s\n' '`curl -fsSL https://rckbrcls.com/api/book-sender/install | bash`'
            echo
            echo "The first corrected installation registers only the pinned public code-signing certificate in the user Keychain."
            echo
            echo "### Update"
            echo
            echo "Automatic updates are delivered through Sparkle."
            echo
            echo "### Current limitation"
            echo
            echo "SMTP delivery remains experimental and is not yet available in this release."
            echo
            echo "### Distribution"
            echo
            echo "This build uses the pinned self-signed Book Sender release identity and is not notarized by Apple."
          } > "$NOTES_FILE"

          echo "NOTES_FILE=$NOTES_FILE" >> "$GITHUB_ENV"

      - name: Commit appcast
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$APPCAST_PATH"
          git commit -m "Update Book Sender appcast for v${SHORT_VERSION}"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh release create "v${SHORT_VERSION}" \
            "$ZIP_PATH" \
            --target "$GITHUB_SHA" \
            --title "Book Sender ${SHORT_VERSION}" \
            --notes-file "$NOTES_FILE" \
            --repo "$REPO"

      - name: Prepare Pages artifact
        run: |
          set -euo pipefail

          mkdir -p public/book-sender
          cp "$APPCAST_PATH" public/book-sender/appcast.xml
          cp scripts/install.sh public/book-sender/install
          cp scripts/signing/BookSenderReleaseSigning.cer public/book-sender/BookSenderReleaseSigning.cer

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy-pages:
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
